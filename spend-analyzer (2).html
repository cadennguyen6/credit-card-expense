<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Expense</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f0f4f8;--surface:#fff;--surface2:#e8eef5;
  --border:#d0dce8;--border2:#b8cad8;
  --text:#1a2a3a;--muted:#5c7fa8;--dim:#8fafc8;
  --accent:#2b4c7e;--accent2:#3d6499;--alight:#dce8f5;
  --red:#c0392b;--red-bg:#fdf0ee;--red-bd:#f0c4be;
  --red2:#8b1a1a;--red2-bg:#f9e0de;--red2-bd:#e8a09a;
  --green:#1f7d4a;--green-bg:#edf7f1;--green-bd:#b3dfc5;
  --chase:#117aca;--capone:#d03027;
  --r:12px;--rs:8px;
  --sh:0 1px 3px rgba(43,76,126,.08),0 0 0 1px rgba(43,76,126,.06);
  --shs:0 1px 2px rgba(43,76,126,.05),0 0 0 1px rgba(43,76,126,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.auth-box{background:var(--surface);border-radius:var(--r);padding:36px 32px;width:100%;max-width:400px;box-shadow:var(--sh);}
.auth-title{font-size:20px;font-weight:700;margin-bottom:4px;}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:24px;}
.auth-label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;margin-top:14px;}
.auth-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;outline:none;}
.auth-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,76,126,.1);}
.auth-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;}
.auth-btn:hover{background:var(--accent2);}
.auth-btn:disabled{opacity:.6;cursor:not-allowed;}
.auth-switch{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;}
.auth-switch a{color:var(--accent);cursor:pointer;text-decoration:underline;}
.auth-err{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);border-radius:var(--rs);padding:8px 12px;font-size:12px;margin-top:10px;}
.auth-ok{background:var(--green-bg);border:1px solid var(--green-bd);color:var(--green);border-radius:var(--rs);padding:8px 12px;font-size:12px;margin-top:10px;}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:var(--accent);box-shadow:0 2px 8px rgba(43,76,126,.2);}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px;}
.h-title{font-size:16px;font-weight:700;color:#fff;}
.h-right{display:flex;align-items:center;gap:12px;}
.h-user{font-size:12px;color:rgba(255,255,255,.75);font-family:'JetBrains Mono',monospace;}
.h-badge{background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.05em;}
.h-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:7px;padding:5px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.h-btn:hover{background:rgba(255,255,255,.25);}
.tab-bar{display:flex;align-items:center;gap:2px;padding:0 32px;border-top:1px solid rgba(255,255,255,.1);}
.tab-btn{background:transparent;border:none;color:rgba(255,255,255,.65);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{color:rgba(255,255,255,.9);}
.tab-btn.active{color:#fff;border-bottom-color:#fff;}

/* LAYOUT */
.layout{display:grid;grid-template-columns:272px 1fr;min-height:calc(100vh - 92px);}
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:18px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;}
.slabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-family:'JetBrains Mono',monospace;}
.srow{display:flex;gap:6px;}
.ifield{flex:1;width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);padding:8px 10px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;outline:none;}
.ifield:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(43,76,126,.1);}
.ifield::placeholder{color:var(--dim);}
.pbtn{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:8px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.pbtn:hover{background:var(--accent2);}
.pbtn:disabled{opacity:.5;cursor:not-allowed;}
.gbtn{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;cursor:pointer;}
.gbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--alight);}
.sbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;padding:3px 5px;border-radius:4px;flex-shrink:0;}
.sbtn:hover{color:var(--red);}

/* Sidebar tree */
.tree{display:flex;flex-direction:column;gap:2px;}
/* Company level */
.co-row{display:flex;align-items:center;gap:3px;}
.co-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;flex:1;min-width:0;transition:all .12s;user-select:none;}
.co-item:hover{background:var(--bg);border-color:var(--border);}
.co-item.on{background:var(--alight);border-color:#a8c4e0;}
.co-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);flex-shrink:0;}
.co-dot.loaded{background:var(--green);}
.co-name{flex:1;font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.co-item.on .co-name{color:var(--accent);}
.co-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);}
/* Bank level */
.bank-row{display:flex;align-items:center;gap:3px;padding-left:14px;}
.bank-item{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;flex:1;min-width:0;transition:all .12s;user-select:none;}
.bank-item:hover{background:var(--bg);}
.bank-item.on{background:var(--alight);border-color:#c4d8ed;}
.bank-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;flex-shrink:0;}
.bank-name{flex:1;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bank-item.on .bank-name{color:var(--accent);}
.bank-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);}
/* Card level */
.card-row{display:flex;align-items:center;gap:3px;padding-left:28px;}
.card-item{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:var(--rs);border:1px solid transparent;cursor:pointer;flex:1;min-width:0;transition:all .12s;}
.card-item:hover{background:var(--bg);}
.card-item.on{background:var(--alight);border-color:#c4d8ed;}
.av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;}
.card-name{flex:1;font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-item.on .card-name{color:var(--accent);}
.card-stat{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--dim);}

/* CONTENT */
.content{padding:26px 30px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;overflow-x:hidden;min-width:0;}
.full-content{padding:26px 30px;display:flex;flex-direction:column;gap:20px;overflow-y:auto;min-height:calc(100vh - 92px);}
.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:460px;text-align:center;}
.ph-ic{width:64px;height:64px;background:var(--alight);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid #b8d0e8;}
.ph-t{font-size:18px;font-weight:700;}
.ph-s{font-size:13px;color:var(--muted);max-width:280px;line-height:1.6;}
.spin-wrap{display:flex;align-items:center;justify-content:center;min-height:300px;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ptop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.ptitle{font-size:21px;font-weight:700;letter-spacing:-.3px;}
.ptitle span{color:var(--accent);}
.btns{display:flex;gap:8px;}

/* Bank badge */
.bank-badge{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700;color:#fff;}

/* Upload */
.uzone{background:var(--surface);border:2px dashed var(--border2);border-radius:var(--r);padding:48px 24px;text-align:center;cursor:pointer;transition:all .18s;}
.uzone:hover,.uzone.drag{border-color:var(--accent);background:var(--alight);}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;}
.tile{background:var(--surface);border-radius:var(--r);padding:14px 12px;box-shadow:var(--shs);border-top:3px solid #ccc;cursor:pointer;transition:box-shadow .15s,transform .12s;}
.tile:hover{box-shadow:var(--sh);transform:translateY(-1px);}
.tile-amt{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:var(--text);margin-bottom:3px;}
.tile-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);}
.tile-ct{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);margin-top:2px;}

/* Panel / table */
.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--shs);overflow:hidden;}
.panel-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.panel-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.panel-ttl{font-size:13px;font-weight:700;}
table{width:100%;border-collapse:collapse;min-width:500px;}
th{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
th.lft{text-align:left;}
td{padding:0;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.foot td{background:var(--bg);border-top:2px solid var(--border2);}
tr.bank-header-row td{background:var(--surface2);}
.ci{display:flex;align-items:center;justify-content:flex-end;padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);}
.ci.lft{justify-content:flex-start;gap:8px;}
.ci.dim{color:var(--dim);}
.ci.red{color:var(--red);}
.ci.click{cursor:pointer;}
.ci.click:hover{text-decoration:underline;color:var(--accent);}
.pinfo{display:flex;flex-direction:column;}
.pname{font-size:13px;font-weight:600;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;}
.pstat{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:1px;}
.pacts{display:flex;gap:5px;margin-left:auto;align-items:center;}
.rebtn{background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;}
.rebtn:hover{border-color:var(--accent);color:var(--accent);}
.editbtn{background:var(--alight);color:var(--accent);border:1px solid #a8c4e0;border-radius:5px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:600;}
.editbtn:hover{background:var(--accent);color:#fff;}
.delbtn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0 3px;opacity:0;}
tr:hover .delbtn{opacity:1;}
.delbtn:hover{color:var(--red);}
.name-input{background:var(--bg);border:1px solid var(--accent);border-radius:5px;padding:3px 8px;font-size:13px;font-weight:600;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none;width:140px;}
.save-btn{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer;}

/* Checklist */
.cklist{display:flex;flex-direction:column;gap:6px;}
.ck-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
.ck-title{font-size:13px;font-weight:700;}
.ck-prog{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
.ck-item{display:flex;align-items:flex-start;gap:10px;border-radius:var(--rs);padding:10px 12px;cursor:pointer;transition:all .2s;}
.ck-box{width:17px;height:17px;border-radius:4px;border:2px solid;background:#fff;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;}
.ck-tick{color:#fff;font-size:10px;font-weight:700;display:none;}
.ck-body{flex:1;}
.ck-who{font-size:11px;font-weight:700;margin-bottom:2px;}
.ck-desc{font-size:13px;font-weight:600;color:var(--text);}
.ck-item.done .ck-desc{text-decoration:line-through;color:var(--muted);}
.ck-why{font-size:11px;margin-top:2px;}
.ck-amt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;padding-left:8px;white-space:nowrap;}
.ok-banner{display:flex;align-items:center;gap:8px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:var(--rs);padding:10px 14px;font-size:13px;color:var(--green);font-weight:500;}
.reviewed-label{margin-top:12px;margin-bottom:4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-family:'JetBrains Mono',monospace;}

/* Exec */
.exec-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;}
.exec-card{background:var(--surface);border-radius:var(--r);padding:18px 16px;box-shadow:var(--shs);}
.exec-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-bottom:10px;font-family:'JetBrains Mono',monospace;}
.exec-val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:500;color:var(--text);margin-bottom:2px;}
.exec-val.red{color:var(--red);}
.exec-sub{font-size:12px;color:var(--muted);}
.top-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--bg);border-radius:var(--rs);}
.top-rank{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);min-width:20px;}
.top-name{font-size:13px;font-weight:600;color:var(--text);}
.top-amt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;margin-left:auto;}
.top-bar-wrap{height:4px;background:var(--border);border-radius:99px;margin-top:4px;}
.top-bar{height:4px;border-radius:99px;background:var(--accent);}

/* Month to Month */
.period-header{font-size:11px;font-weight:700;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:right;white-space:nowrap;}
.trend-up{color:var(--red);}
.trend-dn{color:var(--green);}
.month-section-row td{background:var(--surface2);padding:0;}
.month-section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-family:'JetBrains Mono',monospace;padding:7px 14px;display:block;}

/* Modal */
.mbg{position:fixed;inset:0;background:rgba(26,42,58,.42);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(43,76,126,.22);}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);}
.modal-t{font-size:15px;font-weight:700;}
.modal-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;}
.modal-x:hover{color:var(--text);}
.modal-bd{overflow-y:auto;}
.mhead{display:grid;gap:8px;padding:8px 20px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;}
.mrow{display:grid;gap:8px;padding:10px 20px;border-bottom:1px solid var(--border);align-items:start;font-size:13px;}
.mrow:last-child{border-bottom:none;}
.mrow:hover{background:var(--bg);}
.mrow.flag{background:#fdf8f7;}
.mdate{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding-top:2px;}
.mdesc{font-size:13px;font-weight:600;color:var(--text);}
.mwhy{font-size:11px;color:var(--red);margin-top:2px;}
.mamt{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;text-align:right;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.04em;text-transform:uppercase;}

#fileInput{display:none;}
#modaldiv{display:none;position:fixed;inset:0;z-index:300;}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen" class="auth-wrap">
  <div class="auth-box">
    <div class="auth-title">Credit Card Expense</div>
    <div class="auth-sub" id="authSub">Sign in to your account</div>
    <label class="auth-label">Email</label>
    <input class="auth-input" id="authEmail" type="email" placeholder="you@company.com" onkeydown="if(event.key==='Enter')authSubmit()">
    <label class="auth-label">Password</label>
    <input class="auth-input" id="authPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')authSubmit()">
    <div id="authNameRow" style="display:none;">
      <label class="auth-label">Full Name</label>
      <input class="auth-input" id="authName" type="text" placeholder="Your name">
    </div>
    <button class="auth-btn" id="authBtn" onclick="authSubmit()">Sign In</button>
    <div id="authMsg"></div>
    <div class="auth-switch" id="authSwitch">Don't have an account? <a onclick="toggleAuthMode()">Sign up</a></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <header>
    <div class="header-top">
      <div class="h-title">Credit Card Expense</div>
      <div class="h-right">
        <span class="h-user" id="hUser"></span>
        <span class="h-badge" id="hBadge" style="display:none;">ADMIN</span>
        <button class="h-btn" onclick="signOut()">Sign out</button>
      </div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-expenses" onclick="switchTab('expenses')">&#128179; Expenses</button>
      <button class="tab-btn" id="tab-exec" onclick="switchTab('exec')">&#128202; Executive Summary</button>
      <button class="tab-btn" id="tab-mtm" onclick="switchTab('mtm')">&#128200; Month to Month</button>
    </div>
  </header>

  <div id="view-expenses" class="layout">
    <aside class="sidebar">
      <div>
        <div class="slabel">Add Company</div>
        <div class="srow">
          <input class="ifield" id="coInput" placeholder="Company name..." onkeydown="if(event.key==='Enter')addCo()">
          <button class="pbtn" id="addCoBtn" onclick="addCo()">Add</button>
        </div>
      </div>
      <div>
        <div class="slabel">Companies</div>
        <div class="tree" id="tree"></div>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <div id="view-exec" style="display:none;">
    <div class="full-content" id="execContent"></div>
  </div>
  <div id="view-mtm" style="display:none;">
    <div class="full-content" id="mtmContent"></div>
  </div>
</div>

<input type="file" id="fileInput" accept=".csv">
<div id="modaldiv"></div>

<script>

function toggleAuthMode(){

async function authSubmit(){
  var email=document.getElementById('authEmail').value.trim();
  var pass=document.getElementById('authPass').value;
  var btn=document.getElementById('authBtn');
  if(!email||!pass){setAuthMsg('Please fill in all fields.');return;}
  btn.disabled=true;btn.textContent='Please wait…';
  if(authMode==='signup'){
    var name=document.getElementById('authName').value.trim();
    var {error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
    if(error){setAuthMsg(error.message);btn.disabled=false;btn.textContent='Sign Up';return;}
    setAuthMsg('Account created! Check your email to confirm, then sign in.',true);
    btn.disabled=false;btn.textContent='Sign Up';
  } else {
    var {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){setAuthMsg(error.message);btn.disabled=false;btn.textContent='Sign In';return;}
    await onSignedIn(data.user);
  }
}

function handleBoxOAuthRedirect(){
  var p=new URLSearchParams(window.location.search);
  var status=p.get('box');
  if(!status) return;
  // Strip the param from the URL bar
  p.delete('box');p.delete('reason');
  var clean=window.location.pathname+(p.toString()?'?'+p.toString():'');
  window.history.replaceState({},'',clean);
  if(status==='connected'){
    setTimeout(function(){refreshBoxStatus();},200);
    var msg=document.createElement('div');
    msg.textContent='Box connected!';
    msg.style.cssText='position:fixed;top:20px;right:20px;background:var(--green);color:#fff;padding:10px 18px;border-radius:6px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);';
    document.body.appendChild(msg);
    setTimeout(function(){msg.remove();},3000);
  } else if(status==='error'){
    alert('Box connection failed: '+(p.get('reason')||'unknown'));
  }
}

// Bank detection — filename keywords first (most reliable when present),
// then CSV column shape as fallback, "Unknown" if neither matches.
function detectBankFromCSV(rows,csvText,fileName){
  // 1. Filename keywords
  if(fileName){
    var n=fileName.toLowerCase();
    if(n.indexOf('chase')>=0) return 'Chase';
    if(n.indexOf('capital one')>=0||n.indexOf('capitalone')>=0||n.indexOf('co venture')>=0||/\bco[\s_-]/.test(n)) return 'Capital One';
    if(n.indexOf('amex')>=0||n.indexOf('american express')>=0) return 'American Express';
    if(n.indexOf('citi')>=0) return 'Citi';
    if(n.indexOf('wells')>=0) return 'Wells Fargo';
    if(n.indexOf('discover')>=0) return 'Discover';
    if(n.indexOf('bofa')>=0||n.indexOf('bank of america')>=0) return 'Bank of America';
  }
  // 2. CSV column shape
  if(csvText){
    var firstLine=csvText.split('\n')[0].toLowerCase();
    var hasType=/(^|,)\s*type\s*(,|$)/.test(firstLine);
    var hasDebit=firstLine.indexOf('debit')>=0;
    var hasCredit=firstLine.indexOf('credit')>=0;
    if(hasType && rows.some(function(r){return r.txType;})) return 'Chase';
    if(hasDebit && hasCredit) return 'Capital One';
  }
  return 'Unknown';
}

// Group transactions into canonical merchant names for the Top Vendors panel.
// Catches the common cases — Amazon variants, payment-processor prefixes,
// chains — and falls back to a cleaned-up first-few-words form.
function normalizeVendor(desc){
  if(!desc) return 'Unknown';
  var s=desc.trim().replace(/^(TST\*|SQ\s*\*|DD\s*\*|UEP\*|DMI\*|HI\s*\*|PY\s*\*|PSE\*|TST \*|EB\s*|PSVJ\s*\*)/i,'');
  var u=s.toUpperCase();
  if(/AMAZON|AMZN/.test(u)) return 'Amazon';
  if(/^UBER\s*\*?\s*EATS/.test(u)) return 'Uber Eats';
  if(/^UBER/.test(u)) return 'Uber';
  if(/DOORDASH/.test(u)) return 'DoorDash';
  if(/STARBUCKS/.test(u)) return 'Starbucks';
  if(/CHICK[-\s]?FIL[-\s]?A/.test(u)) return 'Chick-fil-A';
  if(/HOME DEPOT/.test(u)) return 'Home Depot';
  if(/BEST\s?BUY/.test(u)) return 'Best Buy';
  if(/FEDEX/.test(u)) return 'FedEx';
  if(/COMCAST|XFINITY/.test(u)) return 'Comcast / Xfinity';
  if(/AT&?T|^ATT\*/.test(u)) return 'AT&T';
  if(/VERIZON/.test(u)) return 'Verizon';
  if(/MICROSOFT|MSFT/.test(u)) return 'Microsoft';
  if(/^APPLE\.COM|^APPLE\s/.test(u)) return 'Apple';
  if(/COSTCO/.test(u)) return 'Costco';
  if(/TARGET/.test(u)) return 'Target';
  if(/WALMART/.test(u)) return 'Walmart';
  if(/PANERA/.test(u)) return 'Panera Bread';
  if(/REPUBLIC SERVICES/.test(u)) return 'Republic Services';
  if(/SANGOMA/.test(u)) return 'Sangoma';
  if(/SIPTRUNK/.test(u)) return 'SipTrunk';
  if(/WWW\.UI\.COM/.test(u)) return 'Ubiquiti';
  if(/DELL/.test(u)) return 'Dell';
  // Generic: take first 1-2 words, drop trailing digits and store numbers
  var clean=s.replace(/[#*]+.*$/,'').replace(/\s+\d.*$/,'').replace(/\s{2,}/g,' ').trim();
  if(clean.length<3) clean=s;
  return clean.substring(0,30) || 'Unknown';
}

function isSkip(csvCat,desc,txType,amount,isCredit){
  var t=(txType||'').toLowerCase().trim();
  var c=(csvCat||'').toLowerCase();
  var d=(desc||'').toLowerCase();

  // Skip Chase bill payments
  if(t==='payment') return true;

  // Skip Capital One bill payment rows
  if(c==='payment/credit') return true;

  // Skip bill payments by description
  var paymentPhrases=['payment thank you','capital one online pymt','autopay payment',
    'returned online ach','returned ach payment','online payment - thank'];
  if(paymentPhrases.some(function(w){return d.includes(w);})) return true;

  // Capital One credits that aren't payment/credit = refunds → keep (negative amount)
  // Chase returns → keep (negative amount)
  // Everything else that's negative → skip (shouldn't happen but safety net)
  if(amount!==undefined&&amount<0&&t!=='return'&&!isCredit) return true;

  return false;
}

function categorizeTx(row){if(isSkip(row.csvCat,row.description,row.txType,row.amount,row.isCredit))return null;var cat=normCat(row.csvCat);var flagged=shouldFlag(cat,row.amount);return{date:row.date,description:row.description,amount:row.amount,cat:cat,flagged:flagged,flagReason:getFlagReason(cat),reviewed:false};}

function parseDate(d){
  // Returns {yr, mo, day} or null
  if(!d) return null;
  var m;
  if((m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return{yr:m[3].length===2?'20'+m[3]:m[3],mo:parseInt(m[1],10),day:parseInt(m[2],10)};
  if((m=d.match(/^(\d{4})-(\d{2})-(\d{2})/))) return{yr:m[1],mo:parseInt(m[2],10),day:parseInt(m[3],10)};
  return null;
}

function detectPeriod(txs){
  if(!txs.length) return '';
  // Count transactions per calendar month, use the month with the most transactions
  var counts={};
  txs.forEach(function(t){
    var pd=parseDate(t.date);
    if(!pd) return;
    var key=pd.yr+'-'+String(pd.mo).padStart(2,'0');
    counts[key]=(counts[key]||0)+1;
  });
  var best='',bestCount=0;
  Object.keys(counts).forEach(function(k){
    if(counts[k]>bestCount){bestCount=counts[k];best=k;}
  });
  return best;
}

function txBelongsToPeriod(tx, period){
  // Check if a transaction date falls within the calendar month of the period
  if(!period||!tx.date) return true;
  var pd=parseDate(tx.date);
  if(!pd) return true;
  var parts=period.split('-');
  return pd.yr===parts[0] && String(pd.mo).padStart(2,'0')===parts[1];
}
function periodLabel(p){if(!p)return 'Unknown';var parts=p.split('-');if(parts.length!==2)return p;var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return months[parseInt(parts[1],10)-1]+' '+parts[0];}

// ─── CSV parsing ─────────────────────────────────────────────────────────
function parseCSV(text){
  var rows=Papa.parse(text.trim(),{header:true,skipEmptyLines:true}).data;
  var result=[];
  rows.forEach(function(r){
    var keys=Object.keys(r).map(function(k){return k.toLowerCase().trim();});
    var vals=Object.values(r);
    function g(){for(var i=0;i<arguments.length;i++){var n=arguments[i];var idx=keys.findIndex(function(k){return k===n||k.includes(n);});if(idx>=0)return(vals[idx]||'').toString().trim();}return'';}
    var txDateIdx=keys.findIndex(function(k){return k==='transaction date';});
    var dateVal=txDateIdx>=0?vals[txDateIdx]:g('date','posted','time');
    var desc=g('description','desc','merchant','name','memo','narr');
    var cardIdx=keys.findIndex(function(k){return k==='card'||k==='card no'||k==='card number';});
    if(cardIdx<0) cardIdx=keys.findIndex(function(k){return k.includes('card');});
    var cardNo=cardIdx>=0?(vals[cardIdx]||'').toString().trim():'Unknown';
    var csvCat=g('category');
    var txType=g('type');
    var amtRaw=g('amount','amt','charge');
    var debit=parseFloat((g('debit')||'0').replace(/[$,\s]/g,''))||0;
    var credit=parseFloat((g('credit')||'0').replace(/[$,\s]/g,''))||0;
    var amt;
    var isCredit=false;
    if(debit>0||credit>0){
      if(debit>0){amt=debit;}
      else{amt=-credit;isCredit=true;} // negative = credit back to card
    } else {
      // Chase format: amount is negative for charges
      var rawAmt=parseFloat((amtRaw||'0').replace(/[$,\s]/g,''))||0;
      amt=rawAmt; // keep sign as-is from Chase
    }
    if(amt!==0&&desc){
      // Chase Return type → make negative to offset original charge
      var isReturn=(txType||'').toLowerCase()==='return';
      var finalAmt=isReturn?-Math.abs(amt):amt;
      // For Chase charges, amount is already negative — make positive
      if(!isCredit&&!isReturn) finalAmt=Math.abs(finalAmt);
      result.push({date:dateVal,description:desc,amount:finalAmt,cardNo:cardNo,csvCat:csvCat,txType:txType,isCredit:isCredit});
    }
  });
  return result;
}

// ─── PDF parsing ──────────────────────────────────────────────────────────
function normCardNo(cn){return(cn||'').toString().trim().replace(/^0+/,'')||'0';}
function parsePDFNames(text){
  var lines=text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
  var names={};

  // ── Format 1: Capital One ── "FIRSTNAME LASTNAME #CARDNO: ..."
  // e.g. "THU BUI #4145: Transactions"
  var coRe=/^([A-Z][A-Z\s]+?)\s*#(\d{3,4}):/;

  // ── Format 2: Chase ── "NAME\nTRANSACTIONS THIS CYCLE (CARD XXXX)"
  var chaseRe=/TRANSACTIONS THIS CYCLE \(CARD\s+(\d+)\)/i;
  var skipRe=/TRANSACTIONS|ACCOUNT|STATEMENT|PAYMENT|PAGE|DATE|AMOUNT|MERCHANT|ACTIVITY|MANAGE|CUSTOMER|MOBILE|CHASE|SERVICE|INTEREST|BALANCE|PURCHASES|ADVANCES/i;
  var pendingName=null;

  for(var i=0;i<lines.length;i++){
    var line=lines[i];

    // Capital One format: NAME #CARD:
    var m1=line.match(coRe);
    if(m1){
      var name=m1[1].replace(/[^A-Za-z\s\-'.]/g,'').trim();
      var cn=normCardNo(m1[2]);
      if(name&&name.length>2&&cn) names[cn]=name;
      continue;
    }

    // Chase format: TRANSACTIONS THIS CYCLE (CARD XXXX)
    var m2=line.match(chaseRe);
    if(m2){
      var rawCard=m2[1];
      var key=normCardNo(rawCard);
      var before=line.substring(0,line.toUpperCase().indexOf('TRANSACTIONS')).trim();
      before=before.replace(/[^A-Za-z\s\-'.]/g,'').trim();
      var name='';
      if(before&&before.split(' ').length>=2&&before.length>3) name=before;
      if(!name&&pendingName) name=pendingName;
      if(!name){
        for(var back=1;back<=3;back++){
          if(i-back<0) break;
          var prev=lines[i-back];
          if(/TRANSACTIONS THIS CYCLE/i.test(prev)) break;
          if(/^[A-Z][A-Z\s\-'.]+$/.test(prev)&&prev.split(' ').length>=2&&!/\d/.test(prev)&&prev.length>4&&!skipRe.test(prev)){
            name=prev.replace(/[^A-Za-z\s\-'.]/g,'').trim();
            break;
          }
        }
      }
      if(name&&name.length>2) names[key]=name;
      pendingName=null;
      continue;
    }

    // Chase pending name line
    if(/^[A-Z][A-Z\s\-'.]+$/.test(line)&&line.split(' ').length>=2&&!/\d/.test(line)&&line.length>4&&!skipRe.test(line)){
      pendingName=line.replace(/[^A-Za-z\s\-'.]/g,'').trim();
    }
  }
  return names;
}

function lookupPDFName(names,cn){return names[normCardNo(cn)]||null;}
async function extractTextFromPDF(buffer){
  if(window.pdfjsLib){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdf=await pdfjsLib.getDocument({data:buffer}).promise;
    var fullText='';
    for(var i=1;i<=pdf.numPages;i++){
      var page=await pdf.getPage(i);var tc=await page.getTextContent();
      var items=tc.items,lastY=null,line='',lines=[];
      for(var j=0;j<items.length;j++){var item=items[j];var y=Math.round(item.transform[5]);if(lastY!==null&&Math.abs(y-lastY)>3){if(line.trim())lines.push(line.trim());line=item.str;}else{line+=(line?' ':'')+item.str;}lastY=y;}
      if(line.trim())lines.push(line.trim());
      fullText+=lines.join('\n')+'\n';
    }
    return fullText;
  }
  return '';
}

async function removeCo(id){

async function removeBank(coId,bankId){

async function removeCard(coId,bankId,cardId){

  if(curCard){
    for(var i=0;i<co.banks.length;i++){
      var card=co.banks[i].cards.find(function(c){return c.id===curCard;});
      if(card){renderCardView(el,co.banks[i],card);return;}

function aggregateTxs(txs){
  var bycat={};
  txs.forEach(function(tx){
    if(!bycat[tx.cat]) bycat[tx.cat]={total:0,count:0,txs:[]};
    bycat[tx.cat].total+=tx.amount;bycat[tx.cat].count++;bycat[tx.cat].txs.push(tx);
  });
  return bycat;
}

// ─── Company overview ─────────────────────────────────────────────────────
function getLatestPeriod(co){
  var ps={};
  co.banks.forEach(function(b){b.cards.forEach(function(c){c.txs.forEach(function(t){if(t.period)ps[t.period]=true;});});});
  var periods=Object.keys(ps).sort();
  return periods.length?periods[periods.length-1]:null;
}

// ─── Tiles ────────────────────────────────────────────────────────────────
function buildTiles(bycat,scope){
  var cats=Object.keys(bycat).sort(function(a,b){return bycat[b].total-bycat[a].total;});
  if(!cats.length) return '';
  var h='<div class="tiles">';
  cats.forEach(function(cat){
    var d=bycat[cat],col=catColor(cat),isFlag=FLAG_CATS.indexOf(cat.toLowerCase())>=0;
    h+='<div class="tile" style="border-top-color:'+col+';" onclick="openDrill('+sq(cat)+','+sq(scope)+')">';
    h+='<div class="tile-amt" style="'+(isFlag?'color:var(--red)':'')+'">'+fmt(d.total)+'</div>';
    h+='<div class="tile-lbl" style="color:'+col+'">'+cat+'</div>';
    h+='<div class="tile-ct">'+d.count+' transaction'+(d.count!==1?'s':'')+'</div>';
    h+='</div>';
  });
  return h+'</div>';
}

// ─── Drill modal ──────────────────────────────────────────────────────────
function openDrill(cat,scope){
  var txs=[],co=getCo(curCo),col=catColor(cat);
  var isCoScope=scope==='co';
  var isBankScope=!isCoScope&&co.banks.some(function(b){return b.id===scope;});
  var periodFilter=selectedPeriod;
  function matchesPeriod(t){return!periodFilter||t.period===periodFilter;}
  if(isCoScope){co.banks.forEach(function(b){b.cards.forEach(function(c){c.txs.filter(function(t){return t.cat===cat&&matchesPeriod(t);}).forEach(function(t){txs.push(Object.assign({},t,{_who:c.displayName}));});});});}
  else if(isBankScope){var bank=co.banks.find(function(b){return b.id===scope;});if(bank)bank.cards.forEach(function(c){c.txs.filter(function(t){return t.cat===cat&&matchesPeriod(t);}).forEach(function(t){txs.push(Object.assign({},t,{_who:c.displayName}));});});}
  else{co.banks.forEach(function(b){var c=b.cards.find(function(c){return c.id===scope;});if(c)c.txs.filter(function(t){return t.cat===cat&&matchesPeriod(t);}).forEach(function(t){txs.push(Object.assign({},t,{_who:c.displayName}));});});}
  var total=txs.reduce(function(s,t){return s+t.amount;},0);
  var multi=txs.some(function(t,i){return i>0&&t._who!==txs[0]._who;});
  var cols=multi?'110px 90px 1fr 120px 80px':'90px 1fr 120px 80px';

  showModal(cat+' — '+fmt(total)+' ('+txs.length+')',head+rows);
}

// ─── Checklist ────────────────────────────────────────────────────────────
function buildChecklist(flags){
  if(!flags.length) return'<div class="ok-banner">&#10003; No flagged transactions — all spending looks clean.</div>';
  var pending=flags.filter(function(f){return!f.tx.reviewed;});
  var reviewed=flags.filter(function(f){return f.tx.reviewed;});
  pending.sort(function(a,b){var al=a.tx.amount>=1000,bl=b.tx.amount>=1000;if(al&&!bl)return-1;if(!al&&bl)return 1;return b.tx.amount-a.tx.amount;});
  if(!pending.length&&!reviewed.length) return'<div class="ok-banner">&#10003; All flagged transactions reviewed.</div>';
  function makeItem(f,isDone){
    var large=f.tx.amount>=1000;
    var bg=isDone?'var(--green-bg)':(large?'var(--red2-bg)':'var(--red-bg)');
    var bd=isDone?'var(--green-bd)':(large?'var(--red2-bd)':'var(--red-bd)');
    var ac=isDone?'var(--green)':(large?'var(--red2)':'var(--red)');
    return'<div class="ck-item'+(isDone?' done':'')+'" style="background:'+bg+';border:1px solid '+bd+';" onclick="toggleReview('+sq(f.key)+')">'
      +'<div class="ck-box" style="border-color:'+bd+';'+(isDone?'background:var(--green);':'')+'"><span class="ck-tick" style="'+(isDone?'display:block':'display:none')+'">&#10003;</span></div>'
      +'<div class="ck-body"><div class="ck-who" style="color:'+ac+';">'+esc(f.person)+'</div><div class="ck-desc">'+esc(f.tx.description)+'</div>'+(f.tx.flagReason?'<div class="ck-why" style="color:'+(isDone?'var(--dim)':ac)+';">'+esc(f.tx.flagReason)+'</div>':'')+'</div>'
      +'<div class="ck-amt" style="color:'+(isDone?'var(--dim)':ac)+';">'+fmt(f.tx.amount)+'</div></div>';
  }
  var h='<div class="cklist"><div class="ck-hdr"><div class="ck-title">Flagged — review checklist</div><div class="ck-prog">'+reviewed.length+' / '+flags.length+' reviewed</div></div>';
  h+=pending.map(function(f){return makeItem(f,false);}).join('');
  if(reviewed.length) h+='<div class="reviewed-label">Reviewed ('+reviewed.length+')</div>'+reviewed.map(function(f){return makeItem(f,true);}).join('');
  return h+'</div>';
}

async function toggleReview(key){
  // key format: cardId|dbId
  var parts=key.split('|');
  var cardId=parts[0], dbId=parts[1];
  var co=getCo(curCo);if(!co)return;
  var tx=null;
  for(var i=0;i<co.banks.length;i++){
    var c=co.banks[i].cards.find(function(c){return c.id===cardId;});
    if(c){tx=c.txs.find(function(t){return t.dbId===dbId;});break;}
  }
  if(!tx)return;
  tx.reviewed=!tx.reviewed;
  if(dbId) await sb.from('transactions').update({reviewed:tx.reviewed}).eq('id',dbId);
  renderContent();
}

// Core import logic — no DOM coupling. opts: {pdfBuffer, targetBankId, onProgress}.
// Used by both the manual upload modal (runImport) and the Box import modal.
async function runImportCore(csvText,opts){
  opts=opts||{};
  var prog=opts.onProgress||function(){};

  prog('Parsing CSV...');
  var rows=parseCSV(csvText);
  if(!rows.length) throw new Error('No transactions found in CSV.');

  var detectedBank=detectBankFromCSV(rows,csvText,opts.fileName);
  var detectedLower=detectedBank.toLowerCase();
  var co=getCo(curCo);
  if(!co) throw new Error('No company selected.');

  // Case-insensitive bank match so "Chase", "chase", "CHASE" all share one bank.
  var bank=opts.targetBankId
    ?co.banks.find(function(b){return b.id===opts.targetBankId;})
    :co.banks.find(function(b){return (b.bankType||'').toLowerCase()===detectedLower;});

  if(!bank){
    prog('Creating '+detectedBank+' bank...');
    var {data:newBank,error}=await sb.from('banks').insert({company_id:co.id,name:detectedBank,bank_type:detectedBank}).select().single();
    if(error) throw new Error('Error creating bank: '+error.message);
    bank={id:newBank.id,name:detectedBank,bankType:detectedBank,cards:[]};
    co.banks.push(bank);
  }

  // Cardholder names: opts.cardNames takes precedence (pre-computed once for a
  // batch of Box imports). Falls back to parsing opts.pdfBuffer (manual upload).
  var cardNames=opts.cardNames||{};
  if(!opts.cardNames && opts.pdfBuffer){
    try{
      prog('Reading PDF names...');
      var pdfText=await extractTextFromPDF(opts.pdfBuffer);
      cardNames=parsePDFNames(pdfText);
    }catch(e){console.error('PDF extraction error:',e);}
  }

  // Group rows by card, persist each card's new txs
  var cardMap={};
  rows.forEach(function(r){var cn=r.cardNo||'Unknown';if(!cardMap[cn])cardMap[cn]=[];cardMap[cn].push(r);});

  prog('Saving transactions...');
  var totalSaved=0;
  var cardNums=Object.keys(cardMap);
  for(var i=0;i<cardNums.length;i++){
    var cn=cardNums[i];
    var displayName=lookupPDFName(cardNames,cn);
    if(!displayName) displayName=cardNames[cn]||cardNames[cn.replace(/^0+/,'')]||cardNames[cn.padStart(4,'0')]||null;

    var newTxs=cardMap[cn].map(categorizeTx).filter(Boolean);
    newTxs.forEach(function(t){
      var pd=parseDate(t.date);
      if(pd) t.period=pd.yr+'-'+String(pd.mo).padStart(2,'0');
    });

    var existing=bank.cards.find(function(c){return c.card_no===cn;});
    if(!existing){
      var finalName=displayName||('Card '+cn);
      var {data:newCard,error}=await sb.from('cards').insert({bank_id:bank.id,company_id:co.id,card_no:cn,display_name:finalName}).select().single();
      if(error){console.error(error);continue;}
      existing={id:newCard.id,card_no:cn,displayName:finalName,txs:[]};
      bank.cards.push(existing);
    } else if(displayName){
      await sb.from('cards').update({display_name:displayName}).eq('id',existing.id);
      existing.displayName=displayName;
    }

    await clearPeriodsForCard(existing,newTxs);
    await saveTransactions(existing.id,newTxs);
    existing.txs=existing.txs.concat(newTxs);
    totalSaved+=newTxs.length;
  }
  return{totalSaved:totalSaved};
}

// Thin wrapper around runImportCore for the manual upload modal
async function runImport(){
  var btn=document.getElementById('importBtn');
  var prog=document.getElementById('uploadProgress');
  if(!uploadState.csvText){alert('Please select a CSV file first.');return;}
  if(btn)btn.disabled=true;
  if(prog)prog.style.display='block';

  try{
    await runImportCore(uploadState.csvText,{
      fileName:uploadState.csvFileName,
      pdfBuffer:uploadState.pdfBuffer,
      targetBankId:uploadState.targetBankId,
      onProgress:function(msg){if(prog)prog.textContent=msg;}
    });
    resetUploadState();
    closeModal();
    curCard=null;
    render();
  }catch(e){
    console.error(e);
    if(btn)btn.disabled=false;
    if(prog)prog.style.display='none';
    alert(e.message);
  }
}

async function doCSVReupload(text,bankId,cardId){
  var co=getCo(curCo);if(!co)return;
  var bank=co.banks.find(function(b){return b.id===bankId;});if(!bank)return;
  var card=bank.cards.find(function(c){return c.id===cardId;});if(!card)return;
  var newTxs=parseCSV(text).map(categorizeTx).filter(Boolean);
  // Assign each tx its own calendar month from transaction date
  newTxs.forEach(function(t){
    var pd=parseDate(t.date);
    if(pd) t.period=pd.yr+'-'+String(pd.mo).padStart(2,'0');
  });
  await clearPeriodsForCard(card,newTxs);
  await saveTransactions(card.id,newTxs);
  card.txs=card.txs.concat(newTxs);
  render();
}

// Shared helper: clears DB+local rows for every period present in `newTxs`
async function clearPeriodsForCard(card,newTxs){
  var periods={};
  newTxs.forEach(function(t){if(t.period)periods[t.period]=true;});
  var keys=Object.keys(periods);
  for(var i=0;i<keys.length;i++){
    await sb.from('transactions').delete().eq('card_id',card.id).eq('statement_period',keys[i]);
    card.txs=card.txs.filter(function(t){return t.period!==keys[i];});
  }
}

async function saveTransactions(cardId,txs){
  if(!txs.length)return;
  var rows=txs.map(function(tx){return{card_id:cardId,date:tx.date,description:tx.description,amount:tx.amount,category:tx.cat,flagged:tx.flagged,flag_reason:tx.flagReason||'',reviewed:false,statement_period:tx.period||''};});
  for(var i=0;i<rows.length;i+=500){
    var {data,error}=await sb.from('transactions').insert(rows.slice(i,i+500)).select('id');
    if(!error&&data)data.forEach(function(d,j){if(txs[i+j])txs[i+j].dbId=d.id;});
  }
}

  var allTxs=[];
  scopedCos.forEach(function(co){co.banks.forEach(function(b){b.cards.forEach(function(c){c.txs.forEach(function(tx){allTxs.push(Object.assign({},tx,{_card:c.displayName,_bank:b.name,_co:co.name}));});});});});
  if(!allTxs.length){
    var emptyMsg=execCompanyFilter?'No data for the selected company.':'No data yet';
    el.innerHTML=buildExecHeader()+'<div class="ph"><div class="ph-ic">&#128202;</div><div class="ph-t">'+emptyMsg+'</div><div class="ph-s">Upload statements in the Expenses tab first.</div></div>';

  var totalSpend=allTxs.reduce(function(s,t){return s+t.amount;},0);
  var totalFlagged=allTxs.filter(function(t){return t.flagged&&!t.reviewed;}).length;
  var avgTx=totalSpend/allTxs.length;
  var allCards=[];
  scopedCos.forEach(function(co){co.banks.forEach(function(b){b.cards.forEach(function(c){if(c.txs.length)allCards.push({name:c.displayName,bank:b.name,co:co.name,total:c.txs.reduce(function(s,t){return s+t.amount;},0),flagged:c.txs.filter(function(t){return t.flagged&&!t.reviewed;}).length});});});});

      +'<div class="exec-card"><div class="exec-card-title">Pending Review</div><div class="exec-val red">'+totalFlagged+'</div><div class="exec-sub">Flagged transactions</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">'
      +'<div class="panel"><div class="panel-top"><div class="panel-ttl">Top Spenders</div></div><div style="padding:12px 14px;display:flex;flex-direction:column;gap:8px;">'
        +allCards.slice(0,6).map(function(c,i){var pct=(c.total/maxCard*100).toFixed(0);var bcol=bankColor(c.bank);return'<div class="top-item"><span class="top-rank">'+(i+1)+'</span><div style="flex:1;min-width:0;"><div class="top-name">'+esc(c.name)+'</div><div style="font-size:10px;color:var(--dim);"><span style="color:'+bcol+';">'+esc(c.bank)+'</span> · '+esc(c.co)+(c.flagged?' · <span style="color:var(--red)">'+c.flagged+' flagged</span>':'')+'</div><div class="top-bar-wrap" style="width:100%;"><div class="top-bar" style="width:'+pct+'%;"></div></div></div><span class="top-amt">'+fmt(c.total)+'</span></div>';}).join('')

function renderMTM(){
  var el=document.getElementById('mtmContent');
  // Reset filter if the selected company was deleted
  if(mtmCompanyFilter && !companies.find(function(c){return c.id===mtmCompanyFilter;})) mtmCompanyFilter='';
  var scopedCos=mtmCompanyFilter?companies.filter(function(c){return c.id===mtmCompanyFilter;}):companies;
  var periodSet={};
  var cardMap={};
  scopedCos.forEach(function(co){
    co.banks.forEach(function(bank){
      bank.cards.forEach(function(card){
        if(!card.txs.length)return;
        var byPeriod={};
        card.txs.forEach(function(tx){var p=tx.period||detectPeriod([tx])||'Unknown';if(!byPeriod[p])byPeriod[p]=0;byPeriod[p]+=tx.amount;periodSet[p]=true;});
        var key=card.id;
        if(!cardMap[key]) cardMap[key]={name:card.displayName,bank:bank.name,bankType:bank.bankType,co:co.name,coId:co.id,periods:{}};
        Object.keys(byPeriod).forEach(function(p){cardMap[key].periods[p]=(cardMap[key].periods[p]||0)+byPeriod[p];});
      });
    });
  });

  var periods=Object.keys(periodSet).filter(function(p){return p!=='Unknown';}).sort();
  var cardKeys=Object.keys(cardMap);
  if(!periods.length||!cardKeys.length){
    var emptyMsg=mtmCompanyFilter?'No data for the selected company.':'No data yet';
    el.innerHTML=buildMTMHeader()+'<div class="ph"><div class="ph-ic">&#128200;</div><div class="ph-t">'+emptyMsg+'</div><div class="ph-s">Upload statements from multiple months to see trends.</div></div>';

  }

  var grandTotals={};periods.forEach(function(p){grandTotals[p]=0;});
  var thead='<thead><tr><th class="lft">Cardholder</th><th class="lft">Bank</th>'+periods.map(function(p){return'<th class="period-header">'+periodLabel(p)+'</th>';}).join('')+'<th>Total</th><th>Trend</th></tr></thead>';
  var tbodyRows='';

  scopedCos.forEach(function(co){
    var coKeys=cardKeys.filter(function(k){return cardMap[k].coId===co.id;});
    if(!coKeys.length)return;
    tbodyRows+=coSectionRow(co,periods.length+4);
    co.banks.forEach(function(bank){
      var bankKeys=coKeys.filter(function(k){return cardMap[k].bank===bank.name;});
      if(!bankKeys.length)return;
      bankKeys.forEach(function(key,ci){
        var cd=cardMap[key];var rowTotal=0;
        var cells=periods.map(function(p){var v=cd.periods[p]||0;rowTotal+=v;grandTotals[p]=(grandTotals[p]||0)+v;return cell(v>0?fmt(v):'—',{dim:v===0});}).join('');
        var trend='';
        if(periods.length>=2){var last=cd.periods[periods[periods.length-1]]||0;var prev=cd.periods[periods[periods.length-2]]||0;if(prev>0&&last>0){var pct=((last-prev)/prev*100);var cls=pct>5?'trend-up':pct<-5?'trend-dn':'';trend='<span class="'+cls+'">'+(pct>0?'↑':'↓')+Math.abs(pct).toFixed(0)+'%</span>';}}
        var bcol=bankColor(cd.bankType);
        tbodyRows+='<tr><td><div class="ci lft" style="gap:8px;"><div class="av" style="'+avStyle(ci)+'">'+initials(cd.name)+'</div><span style="font-size:13px;font-weight:600;">'+esc(cd.name)+'</span></div></td><td><div class="ci lft"><span style="font-size:11px;font-weight:700;color:'+bcol+';">'+esc(cd.bank)+'</span></div></td>'+cells+cell(fmt(rowTotal),{bold:true})+cell(trend)+'</tr>';
      });
    });
  });

  var grandTotal=Object.values(grandTotals).reduce(function(s,v){return s+v;},0);
  tbodyRows+='<tr class="foot">'+totalsLabelCell()+'<td></td>'+periods.map(function(p){return cell(fmt(grandTotals[p]||0),{bold:true});}).join('')+cell(fmt(grandTotal),{bold:true})+'<td></td></tr>';

  el.innerHTML=
    buildMTMHeader()
    +'<div class="panel"><div class="panel-scroll"><table style="min-width:'+(350+periods.length*130)+'px;">'+thead+'<tbody>'+tbodyRows+'</tbody></table></div></div>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">'
      +periods.map(function(p,i){var v=grandTotals[p]||0;var prev=i>0?grandTotals[periods[i-1]]||0:0;var diff=i>0&&prev>0?((v-prev)/prev*100):null;var diffHtml=diff!==null?'<div style="font-size:11px;margin-top:2px;color:'+(diff>0?'var(--red)':'var(--green)')+';">'+(diff>0?'↑':'↓')+Math.abs(diff).toFixed(1)+'% vs prior</div>':'';return'<div class="exec-card"><div class="exec-card-title">'+periodLabel(p)+'</div><div class="exec-val">'+fmt(v)+'</div>'+diffHtml+'</div>';}).join('')
    +'</div>';
}

}

// ─── Box integration (OAuth via Supabase Edge Functions) ─────────────────
// Each Supabase user connects their own Box account once. Tokens live
// server-side in box_tokens (RLS-scoped). No per-user setup beyond a single
// "Connect Box" click + picking a folder.

var FUNCS_BASE=SUPABASE_URL+'/functions/v1';
var boxState={checked:false,connected:false,login:null,folderId:null,accessToken:null,expiresAt:0};

// Folder-level cache: list of PDFs, lazily parsed into {fileId, fileName, names}.
// On import we pick the ONE PDF whose card numbers best overlap with the CSV's
// card numbers — so a Chase PDF only names Chase cards, CO PDF only names CO.
var boxFolder={pdfIds:[],pdfNames:[],pdfMaps:null};

// Parse every PDF in the folder once; cache per-PDF (not merged).
async function ensureBoxPDFMaps(prog){
  if(boxFolder.pdfMaps!==null) return boxFolder.pdfMaps;
  if(!boxFolder.pdfIds.length){boxFolder.pdfMaps=[];return boxFolder.pdfMaps;}
  var maps=[];
  for(var i=0;i<boxFolder.pdfIds.length;i++){
    if(prog) prog('Reading PDF '+(i+1)+'/'+boxFolder.pdfIds.length+'...');
    try{
      var buf=await fetchBoxFile(boxFolder.pdfIds[i],true);
      var text=await extractTextFromPDF(buf);
      var names=parsePDFNames(text);
      maps.push({fileId:boxFolder.pdfIds[i],fileName:boxFolder.pdfNames[i],names:names});
    }catch(e){console.warn('PDF',boxFolder.pdfNames[i]||boxFolder.pdfIds[i],'failed:',e);}
  }
  boxFolder.pdfMaps=maps;
  return maps;
}

// Pick the PDF whose card-number keys best overlap with this CSV's card numbers.
// Returns {names, source} or {names:{}, source:null} when nothing matches.
function pickBestPDFForCSV(csvText,pdfMaps){
  if(!pdfMaps||!pdfMaps.length) return {names:{},source:null};
  // Extract card numbers from CSV via Papa.parse (same source of truth as import).
  var rows=parseCSV(csvText);
  var csvNos={};
  rows.forEach(function(r){if(r.cardNo){csvNos[r.cardNo]=true;csvNos[normCardNo(r.cardNo)]=true;}});
  var best=null,bestCount=0;
  pdfMaps.forEach(function(pdf){
    var c=0;
    Object.keys(pdf.names).forEach(function(k){if(csvNos[k]||csvNos[normCardNo(k)]) c++;});
    if(c>bestCount){bestCount=c;best=pdf;}
  });
  return best?{names:best.names,source:best.fileName}:{names:{},source:null};
}

function parseBoxFolderId(input){
  var s=(input||'').toString().trim();
  var m=s.match(/folder\/(\d+)/);
  return m?m[1]:s;
}

// Fetch a fresh Box access token (server refreshes if needed) and cache it.
async function refreshBoxStatus(){
  if(!currentUser){boxState.checked=true;boxState.connected=false;return boxState;}
  try{
    var {data:{session}}=await sb.auth.getSession();
    if(!session){boxState.checked=true;boxState.connected=false;return boxState;}
    var res=await fetch(FUNCS_BASE+'/box-token',{headers:{Authorization:'Bearer '+session.access_token}});
    var data=await res.json();
    boxState.checked=true;
    boxState.connected=!!data.connected;
    boxState.login=data.box_user_login||null;
    boxState.folderId=data.folder_id||null;
    boxState.accessToken=data.access_token||null;
    boxState.expiresAt=data.expires_at?Date.parse(data.expires_at):0;
  }catch(e){console.warn('box-token check failed',e);boxState.checked=true;boxState.connected=false;}
  return boxState;
}

// Click handler: kicks off OAuth — gets the Box authorize URL from the
// box-oauth function and redirects the browser there.
async function connectBox(){
  var {data:{session}}=await sb.auth.getSession();
  if(!session){alert('Sign in first.');return;}
  try{
    var res=await fetch(FUNCS_BASE+'/box-oauth/start',{headers:{Authorization:'Bearer '+session.access_token}});
    if(!res.ok){
      var body='';try{body=await res.text();}catch(e){}
      if(res.status===401){
        // Stale or missing session on Supabase's side. Wipe local creds and prompt re-sign-in.
        await sb.auth.signOut();
        alert('Your session has expired. Please sign in again.');
        location.reload();
        return;
      }
      throw new Error('start failed ('+res.status+'): '+body);
    }
    var {url}=await res.json();
    window.location.href=url;
  }catch(e){alert('Could not start Box connect: '+e.message);}
}

async function disconnectBox(){
  if(!confirm('Disconnect Box? You can reconnect anytime.')) return;
  try{
    await sb.from('box_tokens').delete().eq('user_id',currentUser.id);
  }catch(e){console.warn(e);}
  boxState={checked:true,connected:false,login:null,folderId:null,accessToken:null,expiresAt:0};
  closeModal();
}

// Persist the folder choice to box_tokens (RLS allows this update).
async function saveBoxFolder(folderId){
  boxState.folderId=folderId;
  try{await sb.from('box_tokens').update({folder_id:folderId}).eq('user_id',currentUser.id);}
  catch(e){console.warn('folder save failed',e);}
}

// Token getter that auto-refreshes via /box-token if within 60s of expiry.
async function getBoxAccessToken(){
  if(boxState.accessToken && Date.now() < boxState.expiresAt - 60000) return boxState.accessToken;
  await refreshBoxStatus();
  if(!boxState.connected || !boxState.accessToken) throw new Error('Box not connected.');
  return boxState.accessToken;
}

async function loadBoxFiles(){
  var folderInput=document.getElementById('boxFolder');
  if(!folderInput) return;
  var folderId=parseBoxFolderId(folderInput.value);
  if(!/^\d+$/.test(folderId)){alert('Folder ID should be a number, or a Box folder URL.');return;}
  folderInput.value=folderId;
  saveBoxFolder(folderId);

  var listEl=document.getElementById('boxFileList');
  listEl.innerHTML='<div class="spin-wrap" style="min-height:60px;"><div class="spinner"></div></div>';
  try{
    var token=await getBoxAccessToken();
    var res=await fetch('https://api.box.com/2.0/folders/'+folderId+'/items?fields=id,name,type,extension,size,modified_at&limit=200',
      {headers:{Authorization:'Bearer '+token}});
    if(!res.ok){
      var body=await res.text();
      var hint=res.status===401?' &mdash; reconnect Box (token rejected).':
               res.status===403?' &mdash; this Box account doesn\'t have access to that folder.':
               res.status===404?' &mdash; folder not found.':'';
      listEl.innerHTML='<div style="color:var(--red);padding:10px 0;font-size:13px;">Box error '+res.status+hint+'<div style="font-size:11px;color:var(--dim);margin-top:6px;">'+esc(body.substring(0,200))+'</div></div>';
      return;
    }
    var data=await res.json();
    var entries=(data.entries||[]).filter(function(e){return e.type==='file';});
    var pdfs=entries.filter(function(e){return (e.extension||'').toLowerCase()==='pdf';});
    var csvs=entries.filter(function(e){return (e.extension||'').toLowerCase()==='csv';}).map(function(c){
      return {id:c.id,name:c.name,size:c.size,modified_at:c.modified_at};
    });

    // Reset folder-level PDF cache for this load.
    boxFolder.pdfIds=pdfs.map(function(p){return p.id;});
    boxFolder.pdfNames=pdfs.map(function(p){return p.name;});
    boxFolder.pdfMaps=null;
    boxFolder.csvFiles=csvs;

    if(!csvs.length){
      listEl.innerHTML='<div style="padding:10px 0;font-size:13px;color:var(--dim);">No CSV files in this folder.</div>';
      return;
    }
    var rows=csvs.map(function(f,i){
      var kb=f.size?Math.round(f.size/1024)+' KB':'';
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">'
        +'<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(f.name)+'</div>'
        +'<div style="font-size:10px;color:var(--dim);font-family:JetBrains Mono,monospace;margin-top:2px;">'+esc(kb)+(f.modified_at?' &middot; '+f.modified_at.substring(0,10):'')+'</div></div>'
        +'<button class="pbtn" style="font-size:11px;padding:5px 12px;" id="boxbtn'+i+'" onclick="importBoxCSV('+sq(f.id)+','+sq(f.name)+','+i+')">Import</button>'
      +'</div>';
    }).join('');
    listEl.innerHTML='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">'
      +'<div style="font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;font-family:JetBrains Mono,monospace;">'+csvs.length+' CSV'+(csvs.length!==1?'s':'')+(pdfs.length?' &middot; '+pdfs.length+' PDF'+(pdfs.length!==1?'s':'')+' for names':'')+'</div>'
      +'<button class="pbtn" onclick="importAllBoxCSVs()">Import all</button>'
    +'</div>'+rows;
  }catch(e){
    listEl.innerHTML='<div style="color:var(--red);padding:10px 0;font-size:13px;">'+esc(e.message)+'</div>';
  }
}

async function fetchBoxFile(fileId,binary){
  var token=await getBoxAccessToken();
  var res=await fetch('https://api.box.com/2.0/files/'+fileId+'/content',{headers:{Authorization:'Bearer '+token}});
  if(res.status===401){
    // Stale cached token — force refresh once and retry.
    boxState.accessToken=null;
    token=await getBoxAccessToken();
    res=await fetch('https://api.box.com/2.0/files/'+fileId+'/content',{headers:{Authorization:'Bearer '+token}});
  }
  if(!res.ok) throw new Error('Box download failed ('+res.status+')');
  return binary ? await res.arrayBuffer() : await res.text();
}

async function importBoxCSV(fileId,fileName,idx){
  var btn=document.getElementById('boxbtn'+idx);
  var prog=document.getElementById('boxImportProgress');
  if(btn){btn.disabled=true;btn.textContent='Importing...';}
  if(prog){prog.style.display='block';prog.style.color='var(--muted)';prog.textContent='Downloading '+fileName+'...';}
  try{
    var csvText=await fetchBoxFile(fileId,false);
    var pdfMaps=await ensureBoxPDFMaps(function(m){if(prog)prog.textContent=fileName+' &mdash; '+m;});
    var pick=pickBestPDFForCSV(csvText,pdfMaps);
    var result=await runImportCore(csvText,{
      fileName:fileName,
      cardNames:pick.names,
      onProgress:function(msg){if(prog)prog.textContent=fileName+' &mdash; '+msg;}
    });
    render();
    var src=pick.source?' (names from '+pick.source+')':'';
    if(prog){prog.style.color='var(--green)';prog.textContent='&#10003; '+fileName+' &mdash; '+result.totalSaved+' transactions'+src;}
    if(btn){btn.disabled=false;btn.textContent='Re-import';}
  }catch(e){
    console.error(e);
    if(prog){prog.style.color='var(--red)';prog.textContent='Error: '+e.message;}
    if(btn){btn.disabled=false;btn.textContent='Retry';}
  }
}

async function importAllBoxCSVs(){
  var files=boxFolder.csvFiles||[];
  if(!files.length){alert('No files loaded — click Load files first.');return;}
  var prog=document.getElementById('boxImportProgress');
  if(prog){prog.style.display='block';prog.style.color='var(--muted)';}
  files.forEach(function(_,i){var b=document.getElementById('boxbtn'+i);if(b)b.disabled=true;});

  // Parse all PDFs once before any CSV (kept separately, not merged).
  var pdfMaps=await ensureBoxPDFMaps(function(m){if(prog)prog.textContent=m;});

  var total=0,errors=0,withNames=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(prog) prog.textContent='('+(i+1)+'/'+files.length+') '+f.name+'...';
    try{
      var csvText=await fetchBoxFile(f.id,false);
      var pick=pickBestPDFForCSV(csvText,pdfMaps);
      if(pick.source) withNames++;
      var r=await runImportCore(csvText,{
        fileName:f.name,
        cardNames:pick.names,
        onProgress:function(msg){if(prog)prog.textContent='('+(i+1)+'/'+files.length+') '+f.name+' &mdash; '+msg;}
      });
      total+=r.totalSaved;
      var btn=document.getElementById('boxbtn'+i);if(btn)btn.textContent='&#10003;';
    }catch(e){console.error('Error',f.name,e);errors++;}
  }
  render();
  if(prog){
    prog.style.color=errors?'var(--red)':'var(--green)';
    var note=withNames?' ('+withNames+'/'+files.length+' got PDF names)':'';
    prog.textContent='&#10003; Done &mdash; '+total+' transactions'+note+(errors?' ('+errors+' errors)':'');
  }
}
