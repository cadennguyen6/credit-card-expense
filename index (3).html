<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ledger — invoice price tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --paper:#F7F6F2; --card:#FFFFFF; --ink:#1A1A17; --muted:#6E6A62;
    --faint:#9A958C; --line:#E6E3DC; --line-strong:#D8D4CB;
    --brand:#0F5C5C; --brand-ink:#0A4444; --brand-soft:#E4EFEE;
    --up:#B23B2E; --up-soft:#F8E7E4; --down:#2C7A50; --down-soft:#E3F0E8;
    --shadow:0 1px 2px rgba(26,26,23,.04),0 6px 18px rgba(26,26,23,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .num{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .right{text-align:right}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px 80px;}
  .top{position:sticky;top:0;z-index:20;background:rgba(247,246,242,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .top-in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.02em;}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;}
  .nav{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap;}
  .tab{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:550;cursor:pointer;font-size:13px;}
  .tab:hover{background:#efeee9;color:var(--ink);}
  .tab.on{background:var(--brand-soft);color:var(--brand-ink);}
  .scope-select{padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;font-size:13px;font-weight:550;cursor:pointer;max-width:180px;}
  .scope-select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);}
  h1.h1{font-size:24px;font-weight:680;letter-spacing:-.025em;margin:28px 0 4px;}
  .sub{color:var(--muted);margin:0 0 22px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-family:inherit;}
  .btn:hover{background:#faf9f5;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted);}
  .btn.ghost:hover{background:#efeee9;color:var(--ink);}
  .btn.danger{color:var(--up);border-color:transparent;background:transparent;}
  .btn.danger:hover{background:var(--up-soft);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-weight:650;font-size:12px;}
  .pill.up{background:var(--up-soft);color:var(--up);}
  .pill.down{background:var(--down-soft);color:var(--down);}
  .pill.flat{background:#efeee9;color:var(--muted);}
  .row{display:grid;grid-template-columns:1fr 120px 96px 110px;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);cursor:pointer;}
  .row:last-child{border-bottom:none;}
  .row:hover{background:#faf9f5;}
  .row.head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);cursor:default;font-weight:600;}
  .row.head:hover{background:transparent;}
  .iname{font-weight:600;letter-spacing:-.01em;}
  .imeta{color:var(--faint);font-size:12px;margin-top:2px;}
  .price{text-align:right;font-weight:600;}
  .flex-end{display:flex;justify-content:flex-end;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px;}
  .stat{background:var(--card);padding:18px 20px;}
  .stat .k{font-size:12px;color:var(--muted);font-weight:550;}
  .stat .v{font-size:26px;font-weight:680;letter-spacing:-.02em;margin-top:6px;}
  table.led{width:100%;border-collapse:collapse;}
  .led th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;padding:12px 18px;border-bottom:1px solid var(--line);}
  .led td{padding:13px 18px;border-bottom:1px solid var(--line);}
  .led tr:last-child td{border-bottom:none;}
  .led td.r,.led th.r{text-align:right;}
  .flabel{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:550;}
  .drop{border:1.5px dashed var(--line-strong);border-radius:14px;padding:44px 24px;text-align:center;cursor:pointer;background:var(--card);}
  .drop.hot{border-color:var(--brand);background:var(--brand-soft);}
  .in{width:100%;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;font:inherit;background:var(--card);color:var(--ink);}
  .in.num{font-family:ui-monospace,Menlo,monospace;}
  .in.r{text-align:right;}
  .in:focus{outline:2px solid var(--brand-soft);border-color:var(--brand);}
  .empty{text-align:center;padding:64px 24px;color:var(--muted);}
  .empty .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px;font-size:22px;}
  .banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;}
  .banner.warn{background:var(--up-soft);color:#7a271e;}
  .center{min-height:100vh;display:grid;place-items:center;}
  .spin{width:24px;height:24px;border:3px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  .vline{width:1px;height:24px;background:var(--line);margin:0 4px;}
  @media (max-width:680px){
    .row{grid-template-columns:1fr 84px 84px;}
    .row .spark{display:none;}
    .stat-grid{grid-template-columns:1fr;}
    .tab span{display:none;}
  }
</style>
</head>
<body>
<div id="root"><div class="center"><div class="spin"></div></div></div>
<script>
/* ===== CONFIG — both are safe to be public (RLS protects the data) ===== */
const SUPABASE_URL = "https://atstrqdijzijyofbmxvk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF0c3RycWRpanppanlvZmJteHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExOTUzNDIsImV4cCI6MjA5Njc3MTM0Mn0.tg_FgWU5Zk0yZfK78U5bZE5ruqvmka0wqJPb2DFRObU";
/* ====================================================================== */

const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR-SUPABASE");
const sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const root = document.getElementById("root");

/* ---------- helpers ---------- */
const usd = new Intl.NumberFormat("en-US", { style:"currency", currency:"USD" });
const money = n => (n==null||isNaN(n)) ? "\u2014" : usd.format(n);
const norm = s => String(s||"").trim().toLowerCase().replace(/\s+/g," ");
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const monthsAgo = n => { const d=new Date(); d.setMonth(d.getMonth()-n); return d.toISOString().slice(0,10); };
const ytd = () => new Date().getFullYear()+"-01-01";
function ym(d){ const x=new Date(d); return isNaN(x)?(d||""):x.toISOString().slice(0,7); }
function monthLabel(d){ const x=new Date(d); return isNaN(x)?(d||"\u2014"):x.toLocaleDateString("en-US",{month:"short",year:"numeric"}); }
function pct(c,p){ if(p==null||c==null||p===0) return null; return ((c-p)/p)*100; }
function fmtPct(p){ if(p==null) return "\u2014"; return (p>0?"+":"")+p.toFixed(1)+"%"; }
function unitPriceOf(li){
  if(li.unitPrice!=null && !isNaN(li.unitPrice)) return Number(li.unitPrice);
  const q=Number(li.quantity), t=Number(li.total);
  if(!isNaN(q)&&q>0&&!isNaN(t)) return t/q;
  if(!isNaN(t)) return t;
  return null;
}
function buildItems(invoices){
  const map=new Map();
  for(const inv of invoices){
    const per=new Map();
    for(const li of inv.lineItems||[]){
      const k=norm(li.name); if(!k) continue;
      const up=unitPriceOf(li); if(up==null) continue;
      const e=per.get(k)||{name:li.name,sum:0,n:0}; e.sum+=up; e.n++; e.name=li.name; per.set(k,e);
    }
    for(const [k,e] of per){
      const a=map.get(k)||{key:k,name:e.name,points:[]};
      a.name=e.name;
      a.points.push({date:inv.invoiceDate,vendor:inv.vendor,unitPrice:e.sum/e.n});
      map.set(k,a);
    }
  }
  const items=[];
  for(const it of map.values()){
    it.points.sort((a,b)=>new Date(a.date)-new Date(b.date));
    const p=it.points, last=p[p.length-1], prev=p.length>=2?p[p.length-2]:null, first=p[0];
    items.push({...it, latest:last.unitPrice, latestDate:last.date,
      lastChange:prev?pct(last.unitPrice,prev.unitPrice):null,
      totalChange:p.length>=2?pct(last.unitPrice,first.unitPrice):null, count:p.length});
  }
  return items;
}
function aggregatePoints(points,gran){
  const m=new Map();
  for(const p of points){ const d=new Date(p.date);
    const key=gran==="year"?String(isNaN(d)?p.date:d.getFullYear()):(isNaN(d)?p.date:d.toISOString().slice(0,7));
    const e=m.get(key)||{key,sum:0,n:0,date:p.date}; e.sum+=p.unitPrice; e.n++; if(!isNaN(d)&&new Date(e.date)<d)e.date=p.date; m.set(key,e);
  }
  const arr=[...m.values()].map(e=>({key:e.key,label:gran==="year"?e.key:monthLabel(e.date),date:e.date,unitPrice:e.sum/e.n,count:e.n}));
  arr.sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:0); return arr;
}
const FIELD_HINTS={
  vendor:["vendor","supplier","seller","company","merchant","from"],
  invoiceDate:["date","invoice date","invoicedate","period","month"],
  name:["item","description","product","line item","lineitem","name","sku","material"],
  unit:["unit","uom","units","measure"],
  quantity:["quantity","qty","count"],
  unitPrice:["unit price","unitprice","unit_price","price","rate","cost","ppu"],
  total:["total","amount","line total","linetotal","subtotal","extended"],
};
function matchHeaders(headers){
  const low=headers.map(norm), out={};
  for(const [field,hints] of Object.entries(FIELD_HINTS)){
    let best=-1,score=0;
    low.forEach((h,i)=>{ for(const hint of hints){ let s=0; if(h===hint)s=3; else if(h.includes(hint)||hint.includes(h))s=2; if(s>score){score=s;best=i;} }});
    if(best>=0) out[field]=headers[best];
  }
  return out;
}
function parseCsv(text){
  const res=Papa.parse(text,{header:true,skipEmptyLines:true});
  const rows=res.data||[];
  if(!rows.length) throw new Error("That file has no rows.");
  const headers=Object.keys(rows[0]); const m=matchHeaders(headers);
  if(!m.name||(!m.unitPrice&&!m.total)) throw new Error("Couldn't find the columns I need. Include an item/description column and a unit price (or amount) column.");
  const num=v=>{ if(v==null) return null; const n=Number(String(v).replace(/[$,\s]/g,"")); return isNaN(n)?null:n; };
  const groups=new Map();
  for(const r of rows){
    const vendor=m.vendor?r[m.vendor]:"Unspecified vendor";
    const date=m.invoiceDate?r[m.invoiceDate]:"";
    const gk=norm(vendor)+"|"+ym(date);
    const g=groups.get(gk)||{vendor:vendor||"Unspecified vendor",invoiceDate:date,source:"csv",lineItems:[]};
    const name=r[m.name]; if(!name) continue;
    g.lineItems.push({ name:String(name).trim(), unit:m.unit?r[m.unit]:"", quantity:m.quantity?num(r[m.quantity]):null, unitPrice:m.unitPrice?num(r[m.unitPrice]):null, total:m.total?num(r[m.total]):null });
    groups.set(gk,g);
  }
  return [...groups.values()].filter(g=>g.lineItems.length);
}

/* ---------- PDF parsing via pdf.js (free, in-browser, digital PDFs only) ---------- */
async function pdfToLines(file){
  if(!window.pdfjsLib) throw new Error("PDF reader didn't load. Refresh and try again.");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    const rows={};
    for(const it of tc.items){ const y=Math.round(it.transform[5]); (rows[y]=rows[y]||[]).push({x:it.transform[4],s:it.str}); }
    Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>{
      const line=rows[y].sort((a,b)=>a.x-b.x).map(o=>o.s).join(" ").replace(/\s+/g," ").trim();
      if(line) lines.push(line);
    });
  }
  return lines;
}
function parseInvoiceText(lines){
  const joined=lines.join("\n");
  let vendor="Unspecified vendor";
  const ii=lines.findIndex(l=>/^invoice$/i.test(l.trim()));
  if(ii>=0){ for(let i=ii+1;i<lines.length;i++){ if(lines[i].trim()){ vendor=lines[i].trim(); break; } } }
  else if(lines[0]) vendor=lines[0].trim();
  let invoiceDate=new Date().toISOString().slice(0,10);
  const dm=joined.match(/invoice date[:\s]*([0-1]?\d[\/\-.][0-3]?\d[\/\-.]\d{2,4})/i) || joined.match(/\bdate[:\s]*([0-1]?\d[\/\-.][0-3]?\d[\/\-.]\d{2,4})/i);
  if(dm){ const d=new Date(dm[1]); if(!isNaN(d)) invoiceDate=d.toISOString().slice(0,10); }
  const items=[];
  const rowRe=/^(.+?)\s+(\d+(?:\.\d+)?)\s+\$?\s*([\d,]+\.\d{2})\s+\$?\s*([\d,]+\.\d{2})\s*$/;
  for(const l of lines){
    if(/subtotal|sales tax|^\s*tax\b|total|amount due|ways to pay|qty\s+rate|bill to|invoice/i.test(l)) continue;
    const m=l.match(rowRe);
    if(m){
      const name=m[1].replace(/^\d+[.)]?\s*/,"").trim();
      const qty=Number(m[2]); const rate=Number(m[3].replace(/,/g,"")); const amount=Number(m[4].replace(/,/g,""));
      if(name) items.push({name,unit:"",quantity:qty,unitPrice:rate,total:amount});
    }
  }
  if(!items.length){
    const sm=joined.match(/subtotal[:\s]*\$?\s*([\d,]+\.\d{2})/i);
    const tm=joined.match(/total[:\s]*\$?\s*([\d,]+\.\d{2})/i);
    const amt=sm?Number(sm[1].replace(/,/g,"")):(tm?Number(tm[1].replace(/,/g,"")):null);
    items.push({name:"",unit:"",quantity:1,unitPrice:amt,total:amt});
  }
  return [{vendor,invoiceDate,source:"pdf",lineItems:items}];
}
async function parsePdf(file){
  const lines=await pdfToLines(file);
  if(lines.join("").replace(/\s/g,"").length < 12)
    throw new Error("This PDF has no readable text (it looks scanned). Type it in manually or import a CSV.");
  return parseInvoiceText(lines);
}

/* ---------- data layer ---------- */
async function fetchLocations(){ const {data,error}=await sb.from("locations").select("id, name").order("name"); if(error)throw error; return data||[]; }
async function addLocationDb(name){ const {data,error}=await sb.from("locations").insert({name}).select("id, name").single(); if(error)throw error; return data; }
async function deleteLocationDb(id){ const {error}=await sb.from("locations").delete().eq("id",id); if(error)throw error; }
async function fetchInvoices(){
  const {data,error}=await sb.from("invoices")
    .select("id, vendor, invoice_date, location_id, location:locations(name), line_items(name, unit, quantity, unit_price, total)")
    .order("invoice_date",{ascending:true});
  if(error)throw error;
  return (data||[]).map(inv=>({ id:inv.id, vendor:inv.vendor, invoiceDate:inv.invoice_date, locationId:inv.location_id, locationName:inv.location?inv.location.name:null,
    lineItems:(inv.line_items||[]).map(l=>({name:l.name,unit:l.unit,quantity:l.quantity,unitPrice:l.unit_price,total:l.total})) }));
}
async function addInvoice(inv){
  const {data:row,error}=await sb.from("invoices").insert({ vendor:inv.vendor||"Unspecified vendor", invoice_date:inv.invoiceDate||null, source:inv.source||null, file_name:inv.fileName||null, location_id:inv.locationId||null }).select("id").single();
  if(error)throw error;
  const rows=(inv.lineItems||[]).filter(l=>l.name&&unitPriceOf(l)!=null).map(l=>({
    invoice_id:row.id, name:l.name, norm_name:norm(l.name), unit:l.unit||null,
    quantity:l.quantity===""?null:l.quantity, unit_price:l.unitPrice===""?null:l.unitPrice, total:l.total===""?null:l.total }));
  if(rows.length){ const {error:e2}=await sb.from("line_items").insert(rows); if(e2)throw e2; }
}
async function deleteInvoice(id){ const {error}=await sb.from("invoices").delete().eq("id",id); if(error)throw error; }
async function updateInvoice(id,inv){
  const {error}=await sb.from("invoices").update({ vendor:inv.vendor||"Unspecified vendor", invoice_date:inv.invoiceDate||null, location_id:inv.locationId||null }).eq("id",id);
  if(error)throw error;
  const {error:ed}=await sb.from("line_items").delete().eq("invoice_id",id); if(ed)throw ed;
  const rows=(inv.lineItems||[]).filter(l=>l.name&&unitPriceOf(l)!=null).map(l=>({invoice_id:id,name:l.name,norm_name:norm(l.name),unit:l.unit||null,quantity:l.quantity===""?null:l.quantity,unit_price:l.unitPrice===""?null:l.unitPrice,total:l.total===""?null:l.total}));
  if(rows.length){ const {error:e2}=await sb.from("line_items").insert(rows); if(e2)throw e2; }
}

/* ---------- UI bits ---------- */
function sparkline(points,w,h){
  w=w||96; h=h||30;
  if(!points||points.length<2) return '<svg width="'+w+'" height="'+h+'"><line x1="4" y1="'+(h-6)+'" x2="'+(w-4)+'" y2="'+(h-6)+'" stroke="var(--line-strong)" stroke-width="2" stroke-dasharray="2 3"/></svg>';
  const vals=points.map(p=>p.unitPrice), min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, pad=4;
  const step=(w-pad*2)/(points.length-1);
  const y=v=>pad+(h-pad*2)*(1-(v-min)/span);
  const d=points.map((p,i)=>(pad+i*step)+","+y(p.unitPrice)).join(" ");
  const rising=vals[vals.length-1]>=vals[0], col=rising?"var(--up)":"var(--down)";
  const lx=pad+(points.length-1)*step;
  return '<svg width="'+w+'" height="'+h+'"><polyline points="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+lx+'" cy="'+y(vals[vals.length-1])+'" r="2.6" fill="'+col+'"/></svg>';
}
function delta(v,big){
  if(v==null) return '<span class="pill flat">new</span>';
  const cls=v>0.05?"up":v<-0.05?"down":"flat";
  const arrow=v>0.05?"\u2191":v<-0.05?"\u2193":"\u2192";
  const st=big?'style="font-size:14px;padding:5px 11px"':"";
  return '<span class="pill '+cls+'" '+st+'>'+arrow+' <span class="num">'+fmtPct(v)+'</span></span>';
}
function lineChart(points){
  const W=640,H=240,pl=54,pr=16,pt=12,pb=28;
  const vals=points.map(p=>p.unitPrice), min=Math.min(...vals), max=Math.max(...vals);
  const lo=Math.max(0,min*0.95), hi=max*1.05, span=(hi-lo)||1;
  const iw=W-pl-pr, ih=H-pt-pb;
  const x=i=>pl+(points.length===1?iw/2:iw*i/(points.length-1));
  const y=v=>pt+ih*(1-(v-lo)/span);
  const dline=points.map((p,i)=>x(i)+","+y(p.unitPrice)).join(" ");
  let grid="", dots="", xlabels="";
  for(let g=0;g<=3;g++){ const v=lo+span*g/3, yy=y(v); grid+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(W-pr)+'" y2="'+yy+'" stroke="#E6E3DC" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#6E6A62" font-family="ui-monospace,Menlo,monospace">$'+v.toFixed(2)+'</text>'; }
  points.forEach((p,i)=>{ dots+='<circle cx="'+x(i)+'" cy="'+y(p.unitPrice)+'" r="3" fill="#0F5C5C"/>'; const lab=p.label||monthLabel(p.date); if(points.length<=8||i%Math.ceil(points.length/6)===0){ xlabels+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="#6E6A62">'+esc(lab)+'</text>'; } });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+grid+'<polyline points="'+dline+'" fill="none" stroke="#0F5C5C" stroke-width="2.4" stroke-linejoin="round"/>'+dots+xlabels+'</svg>';
}

/* ---------- state ---------- */
const state = {

  view:"tracker", selected:null, loading:false, sort:"change",
  gran:"month", from:"", to:"",
  stage:"idle", draft:null, queue:[], uploadError:"", hot:false, autoSave:false, importProgress:null, importResults:null, editId:null,

function set(p){ Object.assign(state,p); render(); }
state.autoSave = localStorage.getItem("ledger_autosave")==="1";
function scopedInvoices(){
  if(state.scope==="all") return state.invoices;
  if(state.scope==="unassigned") return state.invoices.filter(i=>!i.locationId);
  return state.invoices.filter(i=>i.locationId===state.scope);
}
function scopeName(){
  if(state.scope==="all") return "All locations";
  if(state.scope==="unassigned") return "Unassigned";
  const l=state.locations.find(l=>l.id===state.scope); return l?l.name:"Location";
}
function defaultLoc(){ return (state.scope!=="all"&&state.scope!=="unassigned")?state.scope:""; }

/* ---------- views ---------- */
function viewTrackerList(items){

function viewDetail(item){
  const f=state.from?new Date(state.from):null, t=state.to?new Date(state.to):null;
  const pts=item.points.filter(p=>{ const d=new Date(p.date); if(f&&d<f)return false; if(t&&d>t)return false; return true; });
  const series=aggregatePoints(pts,state.gran);
  const word=state.gran==="year"?"year":"month";
  const granbtn=(k,l)=>'<button class="btn ghost '+(state.gran===k?"primary":"")+'" data-gran="'+k+'" '+(state.gran===k?"":'style="font-size:12px"')+'>'+l+'</button>';

    '<div style="display:flex;gap:6px;align-items:center;margin-left:auto"><span class="flabel" style="margin:0">From</span><input class="in num" id="d-from" type="date" value="'+esc(state.from)+'" style="width:150px"><span class="flabel" style="margin:0">To</span><input class="in num" id="d-to" type="date" value="'+esc(state.to)+'" style="width:150px"></div></div>';
  const head='<button class="btn ghost" data-back="1" style="margin-bottom:14px;padding-left:6px">\u2190 All items</button><h1 class="h1" style="margin-top:0">'+esc(item.name)+'</h1><p class="sub">'+item.count+' invoices \u00b7 '+esc(monthLabel(item.points[0].date))+' \u2013 '+esc(monthLabel(item.latestDate))+'</p>'+ctrls;
  if(!series.length) return head+'<div class="card empty"><p>No invoices for this item in that date range. Widen the range or reset it.</p></div>';
  const last=series[series.length-1], prev=series.length>=2?series[series.length-2]:null, first=series[0];
  const lastChange=prev?pct(last.unitPrice,prev.unitPrice):null;
  const rangeChange=series.length>=2?pct(last.unitPrice,first.unitPrice):null;
  const rows=series.map((s,i)=>({...s,change:i>0?pct(s.unitPrice,series[i-1].unitPrice):null})).reverse();
  const priceHdr=state.gran==="year"?"Avg unit price":"Unit price";

  const chart=series.length>=2?'<div class="card" style="padding:18px 14px 8px;margin-bottom:18px">'+lineChart(series)+'</div>':"";
  const table='<div class="card"><table class="led"><thead><tr><th>'+(state.gran==="year"?"Year":"Month")+'</th><th class="r">'+priceHdr+'</th><th class="r">Change</th></tr></thead><tbody>'+

function viewInvoices(){

/* ---------- render ---------- */
function render(){
  if(!configured){ root.innerHTML='<div class="center"><div class="card" style="padding:28px;max-width:520px"><h1 class="h1" style="margin-top:0">Almost there</h1><p class="sub" style="margin-bottom:0">Fill in SUPABASE_URL and SUPABASE_ANON_KEY near the top of the script.</p></div></div>'; return; }

  if(!state.session){ renderLogin(); return; }
  const items=buildItems(scopedInvoices());

  const showScope=(state.view==="tracker"||state.view==="invoices");
  const tab=(k,l)=>'<button class="tab '+(state.view===k?"on":"")+'" data-tab="'+k+'"><span>'+l+'</span></button>';
  const scopeSel=showScope?'<select class="scope-select" id="scope-select"><option value="all" '+(state.scope==="all"?"selected":"")+'>All locations</option>'+state.locations.map(l=>'<option value="'+esc(l.id)+'" '+(state.scope===l.id?"selected":"")+'>'+esc(l.name)+'</option>').join("")+'<option value="unassigned" '+(state.scope==="unassigned"?"selected":"")+'>Unassigned</option></select>':"";

  if(state.view==="tracker") content = sel?viewDetail(sel):('<h1 class="h1">Price tracker</h1><p class="sub">Line items in '+(state.scope==="all"?"every location":esc(scopeName()))+', sorted by how much each moved since last time.</p>'+viewTrackerList(items));
  else if(state.view==="upload") content=viewUpload();
  else if(state.view==="invoices") content='<h1 class="h1">Invoices</h1><p class="sub">'+(state.scope==="all"?"Everything your team has uploaded.":("Invoices filed under "+esc(scopeName())+"."))+'</p>'+viewInvoices();
  else if(state.view==="locations") content='<h1 class="h1">Locations &amp; projects</h1><p class="sub">Group invoices so you can track prices for each place or project on its own.</p>'+viewLocations();

  wire();

function renderLogin(){
  const signup=state.authMode==="signup";
  root.innerHTML='<div class="center"><div class="card" style="padding:30px;width:380px;max-width:90vw"><div class="brand" style="margin-bottom:6px"><div class="mark">C</div> Ledger</div><h1 style="font-size:20px;font-weight:680;letter-spacing:-.02em;margin:10px 0 4px">'+(signup?"Create account":"Sign in")+'</h1>'+
    (state.sent?'<p style="color:var(--muted);margin-top:8px">Check <b>'+esc(state.email)+'</b> to confirm your account, then come back and sign in.</p>'
      :'<p style="color:var(--muted);margin:0 0 18px">'+(signup?"Use your email and a password (6+ characters).":"Enter your email and password.")+'</p>'+
        (state.authError?'<div class="banner warn">'+esc(state.authError)+'</div>':"")+
        '<input class="in" id="login-email" type="email" placeholder="you@company.com" value="'+esc(state.email)+'" style="margin-bottom:10px"><input class="in" id="login-password" type="password" placeholder="Password" value="'+esc(state.password)+'" style="margin-bottom:12px"><button class="btn primary" id="login-btn" style="width:100%;justify-content:center" '+(state.authBusy?"disabled":"")+'>'+(state.authBusy?"\u2026":(signup?"Create account":"Sign in"))+'</button><p style="color:var(--muted);font-size:13px;text-align:center;margin:14px 0 0">'+(signup?"Already have an account?":"Need an account?")+' <a href="#" id="toggle-mode" style="color:var(--brand-ink);font-weight:600;text-decoration:none">'+(signup?"Sign in":"Create one")+'</a></p>')+

  const btn=document.getElementById("login-btn"); if(btn) btn.onclick=doAuth;
  const tg=document.getElementById("toggle-mode"); if(tg) tg.onclick=e=>{ e.preventDefault(); set({authMode:signup?"signin":"signup",authError:"",sent:false}); };

/* ---------- events ---------- */
async function doAuth(){
  if(!state.email||!state.password){ set({authError:"Enter an email and password."}); return; }
  set({authBusy:true,authError:""});
  try{
    if(state.authMode==="signup"){
      const {data,error}=await sb.auth.signUp({ email:state.email, password:state.password, options:{ emailRedirectTo: window.location.origin+window.location.pathname }});
      if(error){ set({authBusy:false,authError:error.message}); return; }
      if(data.session) set({authBusy:false,password:""});
      else set({authBusy:false,sent:true});
    } else {
      const {error}=await sb.auth.signInWithPassword({ email:state.email, password:state.password });
      if(error) set({authBusy:false,authError:error.message});
      else set({authBusy:false,password:""});
    }
  }catch(e){ set({authBusy:false,authError:e.message||"Something went wrong."}); }
}
function editLine(i,f,val){ const v=(f==="name"||f==="unit")?val:(val===""?"":Number(val)); state.draft.lineItems[i][f]=v; }
function detectInvoices(file){ const isPdf=file.type==="application/pdf"||/\.pdf$/i.test(file.name); return isPdf?parsePdf(file):file.text().then(parseCsv); }
async function handleFiles(list){
  const files=Array.from(list||[]); if(!files.length) return;
  if(state.autoSave){
    set({uploadError:"",stage:"importing",importProgress:{done:0,total:files.length},importResults:null});
    const saved=[], errors=[]; const def=defaultLoc();
    const locName=def?(state.locations.find(l=>l.id===def)||{}).name:"";
    for(let i=0;i<files.length;i++){
      try{
        const invs=await detectInvoices(files[i]);
        for(const inv of invs){ inv.locationId=inv.locationId||def||null; await addInvoice(inv); saved.push({vendor:inv.vendor,date:inv.invoiceDate,items:(inv.lineItems||[]).filter(l=>l.name&&unitPriceOf(l)!=null).length,location:locName}); }
      }catch(e){ errors.push({name:files[i].name,error:e.message}); }
      state.importProgress={done:i+1,total:files.length}; render();
    }
    await loadAll();
    set({stage:"done",importResults:{saved,errors}});
    return;
  }
  set({uploadError:"",stage:"parsing"});
  let all=[]; const errors=[];
  for(const f of files){ try{ all=all.concat(await detectInvoices(f)); }catch(e){ errors.push({name:f.name,error:e.message}); } }
  if(!all.length){ set({uploadError:errors.length?(errors[0].error||"Nothing could be read."):"Nothing could be read from those files.",stage:"idle"}); return; }
  const [first,...rest]=all; first.locationId=first.locationId||defaultLoc();
  set({draft:first,queue:rest,editId:null,stage:"review",uploadError:errors.length?(errors.length+" file(s) couldn\u2019t be read and were skipped."):""});
}
function openEdit(id){
  const iv=state.invoices.find(x=>x.id===id); if(!iv) return;
  const draft={ vendor:iv.vendor, invoiceDate:iv.invoiceDate, locationId:iv.locationId||"", lineItems:(iv.lineItems||[]).map(l=>({name:l.name,unit:l.unit||"",quantity:l.quantity,unitPrice:l.unitPrice,total:l.total})) };
  set({view:"upload",stage:"review",editId:id,draft,queue:[],uploadError:""});
}
async function saveDraft(){
  set({stage:"saving"});
  try{
    const payload={...state.draft, locationId:state.draft.locationId||null, lineItems:state.draft.lineItems.filter(l=>l.name&&unitPriceOf(l)!=null)};
    if(state.editId){ await updateInvoice(state.editId,payload); await loadAll(); set({draft:null,editId:null,stage:"idle",view:"invoices",selected:null}); return; }
    await addInvoice(payload);
    await loadAll();
    if(state.queue.length){ const [n,...rest]=state.queue; n.locationId=n.locationId||defaultLoc(); set({draft:n,queue:rest,stage:"review"}); }
    else set({draft:null,stage:"idle",view:"tracker",selected:null});
  }catch(e){ set({uploadError:e.message||"Couldn't save.",stage:"review"}); }
}
async function addLocationHandler(){ const el=document.getElementById("loc-name"); const name=(el&&el.value||"").trim(); if(!name) return; const loc=await addLocationDb(name); await loadAll(); set({scope:loc.id}); }
function wire(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>set({view:b.dataset.tab,selected:null,uploadError:""}));
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>set({sort:b.dataset.sort}));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>set({selected:b.dataset.open,gran:"month",from:"",to:""}));
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>set({view:b.dataset.go,stage:"idle",importResults:null}));
  const back=document.querySelector("[data-back]"); if(back) back.onclick=()=>set({selected:null});
  const refresh=document.getElementById("refresh"); if(refresh) refresh.onclick=loadAll;
  const signout=document.getElementById("signout"); if(signout) signout.onclick=()=>sb.auth.signOut();
  const ss=document.getElementById("scope-select"); if(ss) ss.onchange=e=>set({scope:e.target.value,selected:null});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{ await deleteInvoice(b.dataset.del); await loadAll(); });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));
  const moreBtn=document.getElementById("import-more"); if(moreBtn) moreBtn.onclick=()=>set({stage:"idle",importResults:null,uploadError:""});
  const auto=document.getElementById("autosave-toggle"); if(auto) auto.onchange=e=>{ localStorage.setItem("ledger_autosave",e.target.checked?"1":"0"); set({autoSave:e.target.checked}); };
  document.querySelectorAll("[data-gran]").forEach(b=>b.onclick=()=>set({gran:b.dataset.gran}));
  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{ const p=b.dataset.preset; if(p==="all")set({from:"",to:""}); else if(p==="ytd")set({from:ytd(),to:""}); else set({from:monthsAgo(p==="12m"?12:24),to:""}); });
  const df=document.getElementById("d-from"); if(df) df.onchange=e=>set({from:e.target.value});
  const dt=document.getElementById("d-to"); if(dt) dt.onchange=e=>set({to:e.target.value});
  const drop=document.getElementById("drop"), file=document.getElementById("file");
  if(drop&&file){
    drop.onclick=()=>file.click();
    drop.ondragover=e=>{e.preventDefault(); if(!state.hot) set({hot:true});};
    drop.ondragleave=()=>{ if(state.hot) set({hot:false}); };
    drop.ondrop=e=>{ e.preventDefault(); state.hot=false; handleFiles(e.dataTransfer.files); };
    file.onchange=e=>handleFiles(e.target.files);
  }
  document.querySelectorAll("[data-i]").forEach(inp=>inp.oninput=e=>editLine(Number(e.target.dataset.i),e.target.dataset.f,e.target.value));
  const fl=document.getElementById("f-location"); if(fl) fl.onchange=e=>state.draft.locationId=e.target.value;
  const fv=document.getElementById("f-vendor"); if(fv) fv.oninput=e=>state.draft.vendor=e.target.value;
  const fd=document.getElementById("f-date"); if(fd) fd.oninput=e=>state.draft.invoiceDate=e.target.value;
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ state.draft.lineItems.splice(Number(b.dataset.rm),1); render(); });
  const sd=document.getElementById("save-draft"); if(sd) sd.onclick=saveDraft;
  const cd=document.getElementById("cancel-draft"); if(cd) cd.onclick=()=>set({draft:null,queue:[],stage:"idle",uploadError:"",view:state.editId?"invoices":"upload",editId:null});
  const la=document.getElementById("loc-add"); if(la) la.onclick=addLocationHandler;
  const ln=document.getElementById("loc-name"); if(ln) ln.onkeydown=e=>{ if(e.key==="Enter") addLocationHandler(); };
  document.querySelectorAll("[data-delloc]").forEach(b=>b.onclick=async()=>{ await deleteLocationDb(b.dataset.delloc); if(state.scope===b.dataset.delloc) state.scope="all"; await loadAll(); });
}

/* ---------- boot ---------- */
async function loadAll(){
  set({loading:true});
  try{ const [inv,locs]=await Promise.all([fetchInvoices(),fetchLocations()]); state.invoices=inv; state.locations=locs; }
  catch(e){ console.error(e); }
  set({loading:false});
}
function boot(){
  if(!configured){ render(); return; }
  sb.auth.getSession().then(({data})=>{ state.session=data.session; render(); if(data.session) loadAll(); });
  sb.auth.onAuthStateChange((_e,s)=>{ const was=!!state.session; state.session=s; render(); if(s&&!was) loadAll(); });
}
boot();
</script>
